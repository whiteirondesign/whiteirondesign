# White Iron Design — Netlify configuration
# Static site: no build step. Netlify serves the repo root as-is.

[build]
  publish = "."
  command = ""

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Always serve the freshest gallery data.
[[headers]]
  for = "/pieces.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
