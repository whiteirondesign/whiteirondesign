# White Iron Design — admin panel configuration
# NOTE: the "repo" line below is filled in during deploy, once the GitHub
# repository exists (format: your-github-username/whiteirondesign).

backend:
  name: github
  repo: whiteirondesign/whiteirondesign
  branch: main
  base_url: https://api.netlify.com

# Where uploaded photos are stored in the project, and how the site links to them.
media_folder: images/gallery
public_folder: /images/gallery

# A friendly editing experience, tuned for one non-technical owner.
site_url: https://whiteirondesign.com
display_url: https://whiteirondesign.com
publish_mode: simple

collections:
  - name: gallery
    label: Gallery
    files:
      - name: pieces
        label: Gallery pieces
        file: pieces.json
        description: >-
          Add, edit, reorder, or remove the pieces shown in the Work section.
          Click "Add Piece", upload a photo, fill in the details, then Publish.
        fields:
          - label: Pieces
            name: pieces
            label_singular: Piece
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string, hint: "e.g. Walnut River Desk" }
              - label: Category
                name: category
                widget: select
                default: dining
                options:
                  - { label: Dining table, value: dining }
                  - { label: Desk, value: desk }
                  - { label: Coffee table, value: coffee }
                  - { label: Side table, value: side }
              - { label: "Details (wood, finish, base)", name: spec, widget: string, required: false, hint: "e.g. Oregon black walnut · Black epoxy river · Welded steel base" }
              - { label: Dimensions, name: dimensions, widget: string, required: false, hint: "e.g. 69\" L · 29\" W · 28.5\" H" }
              - { label: Description, name: description, widget: text, required: false, hint: "A few sentences about the piece. Shown when a visitor opens it." }
              - { label: "Cover photo", name: image, widget: image, hint: "Shown in the gallery grid. Any size — it's cropped to fit automatically." }
              - label: "All photos"
                name: images
                widget: list
                required: false
                hint: "Every photo of the piece, in the order visitors should see them. Include the cover photo first."
                field: { label: Photo, name: photo, widget: image }
              - label: Status
                name: status
                widget: select
                default: available
                options:
                  - { label: Available, value: available }
                  - { label: Sold, value: sold }
