# White Iron Design — admin panel configuration

backend:
  name: github
  repo: whiteirondesign/whiteirondesign
  branch: main
  base_url: https://api.netlify.com

# Where uploaded photos are stored, and how the site links to them.
media_folder: images/gallery
public_folder: images/gallery

site_url: https://whiteirondesign.com
display_url: https://whiteirondesign.com
publish_mode: simple

collections:
  - name: gallery
    label: Gallery
    files:
      - name: pieces
        label: Gallery pieces
        file: pieces.json
        description: >-
          The pieces shown in the Work section. Click "Add Piece", upload your
          photos, fill in the details, then Publish. The first photo is the one
          shown in the grid.
        fields:
          - label: Pieces
            name: pieces
            label_singular: Piece
            widget: list
            summary: "{{fields.name}}"
            fields:
              - label: Name
                name: name
                widget: string
                hint: "e.g. Oak Dining Table"

              - label: Category
                name: category
                widget: select
                default: coffee
                options:
                  - { label: Dining table, value: dining }
                  - { label: Desk, value: desk }
                  - { label: Coffee table, value: coffee }
                  - { label: Side table, value: side }
                hint: "Sets which filter button the piece shows up under."

              - label: "Details line"
                name: spec
                widget: string
                required: false
                hint: "Wood, feature, base. e.g. Solid oak slab · Black epoxy fill · Steel X-frame base"

              - label: Dimensions
                name: dimensions
                widget: string
                required: false
                hint: "Optional. e.g. 69\" L · 29\" W · 28.5\" H"

              - label: Description
                name: description
                widget: text
                required: false
                hint: "A few sentences about the piece."

              - label: Photos
                name: images
                widget: list
                field: { label: Photo, name: photo, widget: image }
                required: false
                hint: "The first photo is the cover shown in the grid. Any size works, it gets cropped to fit."

              - label: Status
                name: status
                widget: select
                default: available
                options:
                  - { label: Available, value: available }
                  - { label: Sold, value: sold }
